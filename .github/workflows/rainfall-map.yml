name: Update toggleable rainfall map

# Schedule intentionally disabled: WeatherNext 3's source bucket is scoped
# to individually-registered Google accounts (confirmed after four
# attempts -- anonymous access, then a fresh service account both got a
# real 403 from Google's servers), not something a CI identity can join
# without a heavier OAuth-refresh-token setup authenticating as the
# account that actually registered. Decided to keep this product (and the
# 6-hourly map) manual/Colab-only for now rather than either drop
# WeatherNext from it or invest in that setup. workflow_dispatch is left
# on so this can still be run/tested on demand -- every model except
# WeatherNext 3 works fine unattended, it's just this one that's missing.
on:
  workflow_dispatch: {}

# Only one run at a time -- a twice-daily schedule shouldn't ever overlap,
# but this is cheap insurance in case a run ever takes long enough to still
# be going when the next one would start.
concurrency:
  group: rainfall-map-pipeline
  cancel-in-progress: false

jobs:
  update-map:
    runs-on: ubuntu-latest
    # This pipeline pulls from 8 different sources (ECMWF x4, GEM, ICON,
    # GFS, WeatherNext 3) and does real interpolation work (ICON's
    # icosahedral regrid in particular) -- generously long timeout since
    # actual per-source latency here hasn't been measured yet on a real
    # runner. Tighten this once a few real runs show the typical duration.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eccodes (system package -- cfgrib and the eccodes python bindings both need the C library)
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build the toggleable rainfall map
        env:
          # obstore's GCSStore auto-detects this env var and authenticates
          # with it (no code-side wiring needed) -- see rainfall_map_bot.py's
          # fetch_weathernext() for why a real (even permission-less)
          # service account identity is required: the WeatherNext 3 bucket
          # is shared with allAuthenticatedUsers, not allUsers, so fully
          # anonymous access gets a real 403 from Google's servers.
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: python rainfall_map_bot.py

      - name: Upload toggle_rainfall_map.html to plots.chennairains.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./output/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Never delete anything already in that remote folder -- this
          # only ever adds/overwrites toggle_rainfall_map.html. Other
          # pipelines (e.g. the radar nowcast bot) upload their own files
          # into this same remote folder, so a clean-slate deploy here
          # would wipe those out.
          dangerous-clean-slate: false
